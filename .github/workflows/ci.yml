name: Linux CI

on:
  push:
    branches: [main, "milestone/**", "release/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  rust-linux-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install shell test dependencies
        run: sudo apt-get update && sudo apt-get install -y zsh fish util-linux
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-x86_64-ubuntu-22.04
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust and shell integration tests
        run: cargo test --workspace --all-targets --locked
      - name: Release archive and installer acceptance
        shell: bash
        run: |
          cargo build --locked --release --package shellbell-cli
          max_required="$({
            readelf --version-info target/release/shellbell |
              grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' |
              sort -Vu |
              tail -n 1
          } || true)"
          [[ -n "$max_required" ]]
          echo "Maximum required GLIBC symbol: $max_required"
          newest="$(printf '%s\n' "$max_required" GLIBC_2.35 | sort -V | tail -n 1)"
          [[ "$newest" == 'GLIBC_2.35' ]]
          version="$(
            awk '
              /^\[workspace\.package\]$/ { in_package = 1; next }
              /^\[/ { in_package = 0 }
              in_package && /^version = / {
                gsub(/^[^"]*"|".*$/, "")
                print
                exit
              }
            ' Cargo.toml
          )"
          bash scripts/package-release.sh \
            target/release/shellbell \
            linux-x86_64 \
            "$version" \
            /tmp/shellbell-release
          (cd /tmp/shellbell-release && sha256sum -c *.sha256)
          tar -tzf "/tmp/shellbell-release/shellbell-${version}-linux-x86_64.tar.gz"
          bash scripts/test-installer.sh target/release/shellbell

  pwa:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run validate:manifest

  linux-arm64-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM64 compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97"
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-aarch64-ubuntu-22.04
      - name: ARM64 release build and GLIBC baseline
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: |
          cargo build \
            --locked \
            --release \
            --target aarch64-unknown-linux-gnu \
            --package shellbell-cli
          binary='target/aarch64-unknown-linux-gnu/release/shellbell'
          max_required="$({
            readelf --version-info "$binary" |
              grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' |
              sort -Vu |
              tail -n 1
          } || true)"
          [[ -n "$max_required" ]]
          echo "Maximum required GLIBC symbol: $max_required"
          newest="$(printf '%s\n' "$max_required" GLIBC_2.35 | sort -V | tail -n 1)"
          [[ "$newest" == 'GLIBC_2.35' ]]

  docker-and-staged-content:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compose validation
        env:
          SHELLBELL_OWNER_BOOTSTRAP_TOKEN: ci-placeholder-owner-token-at-least-32-bytes
          SHELLBELL_VAPID_PUBLIC_KEY: ci-placeholder-public
          SHELLBELL_VAPID_PRIVATE_KEY: ci-placeholder-private
        run: docker compose -f deploy/docker-compose.yml config --quiet
      - name: Docker build
        run: docker build -f deploy/Dockerfile -t shellbell:ci .
      - name: Operational script syntax
        run: bash -n install.sh scripts/*.sh
      - name: Documentation site validation
        run: bash scripts/check-site.sh
      - name: Public-content privacy check
        run: bash scripts/check-public-content.sh
      - name: Diff and secret-shaped-content checks
        shell: bash
        run: |
          git diff --check
          if git grep -nE 'BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{36,}' -- . ':!Cargo.lock'; then
            echo 'secret-shaped content found'
            exit 1
          fi
