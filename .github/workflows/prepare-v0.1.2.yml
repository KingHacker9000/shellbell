name: Prepare v0.1.2

on:
  push:
    branches: [owner-password-agent-hooks]
    paths:
      - ".github/workflows/prepare-v0.1.2.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: owner-password-agent-hooks
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97"
      - name: Bump release metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          version = "0.1.2"
          date = "2026-09-15"

          cargo = Path("Cargo.toml")
          text = cargo.read_text()
          old = 'version = "0.1.1"'
          if old not in text:
              raise SystemExit("workspace version is not 0.1.1")
          cargo.write_text(text.replace(old, f'version = "{version}"', 1))

          compose = Path("deploy/docker-compose.yml")
          text = compose.read_text()
          compose.write_text(text.replace("ghcr.io/kinghacker9000/shellbell:v0.1.1", f"ghcr.io/kinghacker9000/shellbell:v{version}"))

          deploy = Path("docs/DEPLOY_VPS.md")
          text = deploy.read_text()
          deploy.write_text(text.replace("ghcr.io/kinghacker9000/shellbell:v0.1.1", f"ghcr.io/kinghacker9000/shellbell:v{version}"))

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text()
          marker = "## [Unreleased]\n\n"
          if marker not in text:
              raise SystemExit("Unreleased changelog section not found")
          text = text.replace(marker, marker + f"## [{version}] - {date}\n\n", 1)
          text = text.replace(
              "### Added\n\n",
              "### Added\n\n"
              "- Memorable owner-password sign-in with the bootstrap token reserved for first-time setup and password recovery.\n"
              "- Claude Code and Codex lifecycle-hook guidance for zero-model-context Shellbell notifications.\n",
              1,
          )
          text = text.replace(
              "### Changed\n\n",
              "### Changed\n\n"
              "- Owner sessions now default to 30 days and can be configured from 1 through 90 days.\n"
              "- Existing relays upgrade in place without resetting paired sources, receivers, history, or source credentials.\n"
              "- Owner-password verifiers use salted PBKDF2-HMAC-SHA256 storage in the private settings table.\n",
              1,
          )
          text = text.replace(
              "[Unreleased]: https://github.com/KingHacker9000/shellbell/compare/v0.1.1...HEAD",
              f"[Unreleased]: https://github.com/KingHacker9000/shellbell/compare/v{version}...HEAD\n[{version}]: https://github.com/KingHacker9000/shellbell/releases/tag/v{version}",
          )
          changelog.write_text(text)
          PY

          cd pwa
          npm version 0.1.2 --no-git-tag-version
          cd ..

          # Let Cargo refresh only what the manifest-version change requires.
          cargo metadata --format-version 1 >/dev/null

          bash scripts/check-release-version.sh v0.1.2
      - name: Commit generated release bump
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock pwa/package.json pwa/package-lock.json CHANGELOG.md deploy/docker-compose.yml docs/DEPLOY_VPS.md
          git diff --cached --check
          git commit -m "chore: bump Shellbell to v0.1.2"
          git push origin HEAD:owner-password-agent-hooks
