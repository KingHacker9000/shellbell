name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  cli-archives:
    name: CLI archive (${{ matrix.platform }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - target: aarch64-unknown-linux-gnu
            platform: linux-aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-ubuntu-22.04-${{ matrix.target }}
      - name: Verify release version
        run: bash scripts/check-release-version.sh "$GITHUB_REF_NAME"
      - name: Build CLI
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
            export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
          fi
          cargo build \
            --locked \
            --release \
            --target "${{ matrix.target }}" \
            --package shellbell-cli
      - name: Validate GLIBC baseline
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/shellbell"
          max_required="$({
            readelf --version-info "$binary" |
              grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' |
              sort -Vu |
              tail -n 1
          } || true)"
          [[ -n "$max_required" ]] || {
            echo 'could not determine the release GLIBC requirement' >&2
            exit 1
          }
          echo "Maximum required GLIBC symbol: $max_required"
          newest="$(printf '%s\n' "$max_required" GLIBC_2.35 | sort -V | tail -n 1)"
          [[ "$newest" == 'GLIBC_2.35' ]] || {
            echo "release requires $max_required, newer than the GLIBC_2.35 compatibility baseline" >&2
            exit 1
          }
      - name: Smoke test native CLI
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: target/${{ matrix.target }}/release/shellbell --version
      - name: Package archive
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          bash scripts/package-release.sh \
            "target/${{ matrix.target }}/release/shellbell" \
            "${{ matrix.platform }}" \
            "$version" \
            dist
          (cd dist && sha256sum -c *.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: shellbell-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  container-image:
    name: Container image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify release version
        run: bash scripts/check-release-version.sh "$GITHUB_REF_NAME"
      - id: image
        name: Resolve lowercase image name
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=Shellbell
            org.opencontainers.image.description=Private self-hosted terminal attention notifications
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=shellbell-release-container
          cache-to: type=gha,mode=max,scope=shellbell-release-container

  github-release:
    name: GitHub release
    needs: [cli-archives, container-image]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: shellbell-linux-*
          path: dist
          merge-multiple: true
      - name: Verify archives and create checksum manifest
        shell: bash
        run: |
          install -m 0755 install.sh dist/install.sh
          cat dist/*.sha256 | sort > dist/SHA256SUMS
          (cd dist && sha256sum install.sh >> SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS)
          rm dist/*.sha256
      - name: Build release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          base_version="${version%%-*}"
          section="$version"
          if ! grep -Fq "## [$section]" CHANGELOG.md; then
            section="$base_version"
          fi

          {
            if [[ "$version" == *-* ]]; then
              echo "This is a release candidate. Test upgrades and report problems before the stable release."
              echo
            fi
            awk -v header="## [$section]" '
              index($0, header) == 1 { found = 1 }
              found && /^## \[/ && index($0, header) != 1 { exit }
              found { print }
            ' CHANGELOG.md
            echo
            echo "Container image: \`ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_REF_NAME\`"
          } > release-notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          args=(
            "$GITHUB_REF_NAME"
            dist/*.tar.gz
            dist/install.sh
            dist/SHA256SUMS
            --verify-tag
            --title "Shellbell $GITHUB_REF_NAME"
            --notes-file release-notes.md
          )
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi
          gh release create "${args[@]}"
