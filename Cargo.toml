[workspace]
members = [
  "crates/shellbell-cli",
  "crates/shellbell-core",
  "crates/shellbell-protocol",
  "crates/shellbell-relay",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.97"

[workspace.dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.54", features = ["derive"] }
cookie = "0.18.1"
directories = "6.0.0"
hex = "0.4.3"
http = "1.4.0"
rand = "0.9.2"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
shellbell-core = { path = "crates/shellbell-core" }
shellbell-protocol = { path = "crates/shellbell-protocol" }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono"] }
subtle = "2.6.1"
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["full"] }
tower = { version = "0.5.2", features = ["util", "limit"] }
tower-http = { version = "0.6.8", features = ["catch-panic", "compression-gzip", "fs", "limit", "request-id", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.19.0", features = ["serde", "v4"] }
web-push = { version = "0.11.0", default-features = false, features = ["isahc-client"] }

[profile.release]
lto = "thin"
strip = true
